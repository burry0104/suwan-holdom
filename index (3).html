<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1412">
<title>우리끼리 홀덤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen card room — felt oval stage with seats on its rim, docked action rail below; chat column on wide screens, bottom sheet on phones */
:root{
  --room:#0b1412; --room-2:#122019; --panel:#15231e; --panel-2:#1b2c26;
  --felt:#1f6150; --felt-deep:#0d3128; --rail:#4a2f1b; --rail-hi:#6b4528; --rail-dark:#241509;
  --brass:#dcaa4c; --brass-ink:#2a1d07; --brass-soft:rgba(220,170,76,.18);
  --ivory:#f7f0de; --card-ink:#1d1b18; --suit-red:#c4382a;
  --text:#e7eee9; --muted:#8fa89e; --line:rgba(231,238,233,.11);
  --danger:#e4705f; --ok:#6fcf98;
  --f-display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--room)}
body{height:100%;margin:0;background:radial-gradient(120% 70% at 50% 0%,#14251f 0%,var(--room) 60%);color:var(--text);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}

#app{height:100%;display:flex;flex-direction:column;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:8px;padding-block:8px;flex:0 0 auto;min-height:50px}
.brand{font-family:var(--f-display);font-size:19px;letter-spacing:.02em;color:var(--ivory);white-space:nowrap}
.brand b{color:var(--brass);font-weight:400}
.spacer{flex:1}
.chip-code{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--brass-soft);background:var(--room-2);border-radius:999px;padding:3px 10px 3px 8px;color:var(--brass);font-family:var(--f-num);font-size:17px;letter-spacing:.12em;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--danger);flex:0 0 auto;transition:background .3s}
.dot.on{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.btn{white-space:nowrap;border:1px solid var(--line);background:var(--panel-2);border-radius:11px;padding:8px 14px;font-weight:500;transition:transform .08s,background .15s,opacity .15s;user-select:none;-webkit-user-select:none}
.btn:hover:not(:disabled){background:#22362f}
.btn:active:not(:disabled){transform:scale(.96)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.brass{background:linear-gradient(180deg,#e8bb62,var(--brass));color:var(--brass-ink);border-color:transparent;font-weight:600}
.btn.ivory{background:linear-gradient(180deg,#fffaf0,var(--ivory));color:var(--card-ink);border-color:transparent;font-weight:600}
.btn.ghost{background:transparent}
.btn.warn{border-color:var(--danger);color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn.icon{padding:5px 9px;font-size:15px;line-height:1.2}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:4px}

/* ---------- cards ---------- */
.card{--w:44px;width:var(--w);height:calc(var(--w)*1.4);border-radius:calc(var(--w)*.11);background:linear-gradient(165deg,#fffdf6 0%,var(--ivory) 70%,#ebe2cb 100%);color:var(--card-ink);position:relative;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 3px 8px rgba(0,0,0,.38);transition:transform .25s,filter .25s,box-shadow .25s}
.card .ix{position:absolute;left:9%;top:5%;display:flex;flex-direction:column;align-items:center;line-height:.92;font-family:var(--f-num);font-weight:700;font-size:calc(var(--w)*.36)}
.card .ix i{font-style:normal;font-size:calc(var(--w)*.27);margin-top:1px}
.card .pip{position:absolute;right:8%;bottom:5%;font-size:calc(var(--w)*.56);line-height:1}
.card.red{color:var(--suit-red)}
.card.sm .pip{display:none}
.card.sm .ix{left:0;right:0;top:9%;font-size:calc(var(--w)*.48)}
.card.sm .ix i{font-size:calc(var(--w)*.4)}
.card.back{background:radial-gradient(circle at 50% 50%,transparent 0 24%,rgba(220,170,76,.35) 25% 27%,transparent 28%),repeating-linear-gradient(45deg,var(--rail) 0 3px,var(--rail-hi) 3px 6px);box-shadow:inset 0 0 0 2px var(--ivory),inset 0 0 0 3.5px var(--rail-dark),0 3px 8px rgba(0,0,0,.38)}
.card.slot{background:rgba(0,0,0,.12);box-shadow:inset 0 0 0 1.5px rgba(247,240,222,.14)}
.card.sm{--w:25px}.card.md{--w:clamp(34px,8vw,50px)}.card.lg{--w:clamp(50px,13vw,62px)}
.card.dim{filter:brightness(.42) saturate(.5)}
.card.hl{transform:translateY(-12%);box-shadow:0 0 0 2px var(--brass),0 8px 18px rgba(220,170,76,.45)}
.card.flip{animation:flip .38s cubic-bezier(.2,.7,.3,1.2) both}
.card.deal{animation:deal .34s ease-out both}
@keyframes flip{from{transform:perspective(400px) rotateY(95deg) scale(.9);filter:brightness(.6)}to{transform:none}}
@keyframes deal{from{transform:translate(0,-26px) rotate(-10deg) scale(.8);opacity:0}to{transform:none;opacity:1}}

/* ---------- home ---------- */
#home{flex:1;overflow:auto;display:grid;place-items:center;padding-block:10px 28px}
.home-inner{width:100%;max-width:430px;display:flex;flex-direction:column;gap:22px}
.hero{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.fan{position:relative;height:118px;width:210px}
.fan .card{position:absolute;left:50%;bottom:0;transform-origin:50% 130%}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:42px;line-height:1.08;margin:0;color:var(--ivory);text-wrap:balance}
.hero p{margin:0;color:var(--muted);max-width:32ch}
.form{display:flex;flex-direction:column;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted);letter-spacing:.04em}
.input{background:var(--room);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:16px;width:100%;min-width:0}
.input:focus{border-color:rgba(220,170,76,.5);outline:none}
.input.code{font-family:var(--f-num);letter-spacing:.3em;text-transform:uppercase;font-size:20px}
.row{display:flex;gap:8px;align-items:stretch}
.row > .input{flex:1}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.note{font-size:12.5px;color:var(--muted);line-height:1.6;border-top:1px dashed var(--line);padding-top:12px}
.note b{color:var(--text);font-weight:500}
.resume{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--brass-soft);border:1px solid rgba(220,170,76,.35);border-radius:12px;padding:10px 12px}

/* ---------- room ---------- */
#room{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding-bottom:10px}
@media (min-width:980px){#room{grid-template-columns:minmax(0,1fr) 310px}}
.stage{min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px;overflow:auto}
.tablewrap{position:relative;flex:1;min-height:320px;display:grid;place-items:center;padding:38px 28px 44px}
.table{position:relative;width:min(100%,440px);aspect-ratio:5/6;min-width:250px}
@media (min-width:700px){.table{aspect-ratio:16/10;width:min(100%,calc((100vh - 300px)*1.6),920px)}}
.felt{position:absolute;inset:0;border-radius:44%/36%;
  background:radial-gradient(110% 80% at 50% 35%,rgba(255,255,255,.07),transparent 60%),radial-gradient(120% 90% at 50% 45%,var(--felt) 0%,var(--felt-deep) 80%);
  border:clamp(10px,2.4vw,16px) solid var(--rail);
  box-shadow:0 0 0 2px var(--rail-dark),inset 0 0 0 1px rgba(0,0,0,.45),inset 0 2px 0 1px rgba(255,255,255,.04),inset 0 14px 50px rgba(0,0,0,.4),0 28px 70px rgba(0,0,0,.55)}
.felt::before{content:"";position:absolute;inset:-1px;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(107,69,40,.9);pointer-events:none}
@media (min-width:700px){.felt{border-radius:999px}}
.felt::after{content:"";position:absolute;inset:14%;border-radius:inherit;border:1.5px solid rgba(220,170,76,.2)}
.stamp{position:absolute;left:50%;top:21%;transform:translateX(-50%);font-family:var(--f-display);color:rgba(247,240,222,.06);font-size:clamp(17px,3.6vw,28px);white-space:nowrap;pointer-events:none;letter-spacing:.06em}
#layer{position:absolute;inset:0}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:78%;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;z-index:1}
.pot{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-num);font-size:19px;color:var(--ivory);background:rgba(0,0,0,.28);border:1px solid rgba(220,170,76,.25);padding:2px 12px 2px 8px;border-radius:999px;letter-spacing:.03em}
.pot small{font-family:var(--f-body);font-size:10.5px;color:var(--brass);letter-spacing:.12em;font-weight:600}
.pot.bump{animation:bump .35s ease-out}
@keyframes bump{40%{transform:scale(1.12)}}
.board{display:flex;gap:4px;justify-content:center;min-height:calc(clamp(34px,8vw,50px)*1.4)}
.status{font-size:13px;color:var(--ivory);min-height:20px;text-wrap:balance}
.blinds{font-size:11px;color:var(--muted);letter-spacing:.06em}
.lobby-code{font-family:var(--f-num);font-size:clamp(34px,9vw,54px);letter-spacing:.22em;color:var(--ivory);line-height:1;padding-left:.22em}
.lobby-sub{font-size:12px;color:var(--muted)}

/* result banner */
.result{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 14px 8px;border-radius:14px;background:rgba(6,20,16,.72);border:1px solid rgba(220,170,76,.35);box-shadow:0 10px 30px rgba(0,0,0,.4);animation:rise .4s cubic-bezier(.2,.8,.3,1.3) both;max-width:100%}
.result .rk{font-family:var(--f-display);font-size:clamp(20px,4.6vw,28px);color:var(--brass);line-height:1.2}
.result.split .rk{color:#9fd8ff}
.result .rd{font-size:12.5px;color:var(--ivory);text-wrap:balance}
.result .rs{font-size:11.5px;color:var(--muted)}
.result .rs b{color:var(--ok);font-weight:600}
@keyframes rise{from{transform:translateY(8px) scale(.92);opacity:0}to{transform:none;opacity:1}}

/* seats */
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:98px;z-index:2;transition:left .45s ease,top .45s ease}
.seat .hc{display:flex;gap:2px;height:35px;align-items:flex-end;margin-bottom:-14px;position:relative;z-index:0}
.seat .hc .card:first-child{transform:rotate(-6deg)}.seat .hc .card:last-child{transform:rotate(6deg)}
.seat .hc .card.hl{transform:translateY(-14%)}
.av{--c:#567;position:relative;z-index:1;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.22),transparent 60%),var(--c);display:grid;place-items:center;font-family:var(--f-display);font-size:19px;color:#fff;box-shadow:0 0 0 2.5px var(--room-2),0 5px 14px rgba(0,0,0,.45);text-shadow:0 1px 2px rgba(0,0,0,.35)}
.av svg{position:absolute;left:-6px;top:-6px;width:58px;height:58px;transform:rotate(-90deg);pointer-events:none;opacity:0;transition:opacity .2s}
.av svg circle{fill:none;stroke:var(--brass);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:169.6;stroke-dashoffset:0}
.av svg.low circle{stroke:var(--danger)}
.av .crown{position:absolute;top:-12px;right:-6px;font-size:16px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.plate{position:relative;z-index:2;margin-top:-7px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2px 8px 3px;min-width:78px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.plate .nm{font-size:11.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:84px;line-height:1.35}
.plate .stk{font-family:var(--f-num);font-size:15px;color:var(--brass);line-height:1.1}
.seat .tg{min-height:19px;margin-top:3px;display:flex;flex-direction:column;align-items:center;gap:2px}
.seat.me .plate{border-color:rgba(247,240,222,.4)}
.seat.turn .av svg{opacity:1}
.seat.turn .plate{border-color:var(--brass);box-shadow:0 0 0 3px rgba(220,170,76,.22),0 4px 16px rgba(0,0,0,.5)}
.seat.folded .av,.seat.out .av,.seat.aw .av{filter:grayscale(.8) brightness(.6)}
.seat.folded .plate,.seat.out .plate{opacity:.55}
.seat.win .av{box-shadow:0 0 0 2.5px var(--ok),0 0 22px rgba(111,207,152,.65)}
.seat.win .plate{border-color:var(--ok)}
.tag{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--ivory);color:var(--card-ink);white-space:nowrap;letter-spacing:.02em;animation:tagin .2s ease-out}
.tag.muted{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
.tag.win{background:var(--ok);color:#0b2015}
.tag.allin{background:var(--danger);color:#fff}
.tag.hn{background:rgba(0,0,0,.45);color:var(--ivory);border:1px solid rgba(247,240,222,.25);font-weight:500}
@keyframes tagin{from{transform:scale(.7);opacity:0}}
.bub{position:absolute;bottom:calc(100% - 2px);left:50%;transform:translateX(-50%);z-index:6;pointer-events:none}
.bubble{position:relative;background:var(--ivory);color:var(--card-ink);font-size:12px;padding:5px 9px;border-radius:11px;max-width:150px;width:max-content;word-break:break-all;box-shadow:0 4px 12px rgba(0,0,0,.4);animation:pop .22s ease-out}
.bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--ivory)}
.bubble.emo{font-size:26px;padding:2px 8px;line-height:1.25}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.gain{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-family:var(--f-num);font-size:20px;font-weight:700;color:var(--ok);text-shadow:0 2px 6px rgba(0,0,0,.7);pointer-events:none;animation:gain 1.8s ease-out forwards;z-index:7}
@keyframes gain{0%{transform:translate(-50%,6px);opacity:0}15%{opacity:1}100%{transform:translate(-50%,-40px);opacity:0}}
.bet{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:4px;font-family:var(--f-num);font-size:14px;color:var(--ivory);z-index:1;white-space:nowrap;background:rgba(0,0,0,.3);padding:0 7px 0 3px;border-radius:999px;transition:opacity .2s}
.chipico{width:15px;height:15px;border-radius:50%;background:conic-gradient(var(--brass) 0 12.5%,var(--ivory) 0 25%,var(--brass) 0 37.5%,var(--ivory) 0 50%,var(--brass) 0 62.5%,var(--ivory) 0 75%,var(--brass) 0 87.5%,var(--ivory) 0);box-shadow:inset 0 0 0 3px var(--brass),0 1px 2px rgba(0,0,0,.5)}
.dbtn{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:var(--ivory);color:var(--card-ink);font-family:var(--f-num);font-weight:700;font-size:13px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.5),inset 0 -2px 0 rgba(0,0,0,.12);z-index:1;transition:left .5s ease,top .5s ease}

/* emoji */
.emobtn{position:absolute;right:6px;top:6px;z-index:8;width:46px;height:46px;border-radius:50%;border:1px solid rgba(220,170,76,.4);background:var(--panel);font-size:23px;line-height:1;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.45);transition:transform .12s}
.emobtn:active{transform:scale(.92)}
.emopanel{position:absolute;right:6px;top:60px;z-index:9;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px;display:grid;grid-template-columns:repeat(4,44px);gap:4px;box-shadow:0 16px 40px rgba(0,0,0,.55);animation:pop .16s ease-out}
.emopanel button{width:44px;height:44px;border:0;border-radius:11px;background:transparent;font-size:26px;line-height:1;display:grid;place-items:center}
.emopanel button:hover{background:var(--panel-2)}
.emopanel button:active{transform:scale(.85)}
/* showdown reveal */
.reveal{position:absolute;inset:0;z-index:7;display:grid;place-items:center;padding:12px;background:radial-gradient(closest-side,rgba(5,14,11,.55),rgba(5,14,11,.25));backdrop-filter:blur(1.5px);-webkit-backdrop-filter:blur(1.5px);cursor:pointer;animation:fadein .25s ease-out}
@keyframes fadein{from{opacity:0}}
.rv{max-width:min(100%,640px);display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 18px 14px;border-radius:20px;background:linear-gradient(180deg,rgba(23,40,34,.97),rgba(12,24,20,.97));border:1px solid rgba(220,170,76,.45);box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 6px rgba(220,170,76,.06);text-align:center;animation:rise .4s cubic-bezier(.2,.8,.3,1.25) both;cursor:default}
.rv .rk{font-family:var(--f-display);font-size:clamp(24px,6vw,34px);line-height:1.15;color:var(--brass)}
.rv.split .rk{color:#9fd8ff}
.rv .ws{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 18px}
.rv .w{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.rv .wn{font-size:14px;font-weight:600;color:var(--ivory)}
.rv .wn small{color:var(--muted);font-weight:500}
.rv .hc2{display:flex;gap:7px}
.rv .hc2 .card{--w:clamp(58px,15vw,84px)}
.rv .hc2 .card.dim{filter:brightness(.8) saturate(.75)}
.rv.many .hc2 .card{--w:clamp(44px,11vw,64px)}
.rv .hc2 .card:nth-child(1){animation-delay:.12s}.rv .hc2 .card:nth-child(2){animation-delay:.24s}
.rv .hn{font-family:var(--f-display);font-size:17px;color:var(--ivory)}
.rv .hn em{font-style:normal;font-family:var(--f-body);font-size:12px;color:var(--brass);margin-left:6px}
.rv .b5{display:flex;gap:3px}
.rv .b5 .card{--w:24px}
.rv .amt{font-family:var(--f-num);font-size:20px;color:var(--ok)}
.rv .hidden{font-size:13px;color:var(--muted);padding:6px 0}
.rv .foot{font-size:11.5px;color:var(--muted);line-height:1.6}
.rv .foot b{color:var(--ok);font-weight:600}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.bigemo{position:absolute;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-50%);animation:boom 2.1s cubic-bezier(.2,.8,.3,1) forwards}
.bigemo .e{font-size:min(38vw,190px);line-height:1;filter:drop-shadow(0 12px 28px rgba(0,0,0,.55))}
.bigemo .who{margin-top:2px;font-size:14px;font-weight:600;color:var(--card-ink);background:var(--ivory);padding:2px 10px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.4)}
@keyframes boom{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}14%{transform:translate(-50%,-50%) scale(1.18) rotate(4deg);opacity:1}26%{transform:translate(-50%,-50%) scale(1) rotate(0)}72%{transform:translate(-50%,-56%) scale(1);opacity:1}100%{transform:translate(-50%,-90%) scale(.85);opacity:0}}

/* dock */
.dock{flex:0 0 auto;position:sticky;bottom:0;z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;min-height:96px;box-shadow:0 -8px 30px rgba(0,0,0,.3)}
.myhand{display:flex;align-items:center;gap:10px;min-width:0}
.myhand .cards{display:flex;gap:5px}
.myhand .meta{display:flex;flex-direction:column;gap:1px;min-width:0}
.myhand .meta .lbl{font-size:11px;color:var(--muted);letter-spacing:.06em}
.myhand .meta .val{font-weight:600;color:var(--ivory)}
.myhand .meta .stk{font-family:var(--f-num);color:var(--brass);font-size:17px}
.actions{flex:1 1 300px;display:flex;flex-direction:column;gap:8px;min-width:0}
.actrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.actrow .btn{padding:12px 6px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actrow kbd{display:none;font-family:var(--f-num);font-size:11px;opacity:.5;margin-left:4px}
@media (hover:hover) and (min-width:980px){.actrow kbd{display:inline}}
.raiserow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.raiserow input[type=range]{flex:1 1 140px;accent-color:var(--brass);min-width:0}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.waitmsg{flex:1 1 220px;color:var(--muted);font-size:13px}
.waitmsg b{color:var(--ivory);font-weight:500}
.timer{font-family:var(--f-num);color:var(--brass);font-size:15px}
.myturn{display:flex;align-items:center;gap:8px;font-family:var(--f-display);color:var(--brass);font-size:15px}
.botbar{flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px;border-radius:12px;background:var(--room-2);border:1px dashed rgba(220,170,76,.3)}
.botbar .lbl{font-size:12px;color:var(--muted);margin-right:2px}
.botbar .select{width:auto;padding:6px 8px}
.botchip{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 9px}
.botchip button{border:0;background:transparent;color:var(--muted);width:22px;height:22px;border-radius:50%;line-height:1;font-size:13px}
.botchip button:hover{background:rgba(228,112,95,.2);color:var(--danger)}
.av.bot{font-family:var(--f-body);font-size:23px}
.tag.ai{background:transparent;color:#9fd8ff;border:1px solid rgba(159,216,255,.35);font-weight:500}
.seat.turn.isbot .av{animation:think 1.1s ease-in-out infinite}
@keyframes think{50%{box-shadow:0 0 0 2.5px var(--room-2),0 0 0 7px rgba(159,216,255,.25),0 5px 14px rgba(0,0,0,.45)}}
.settings{flex:1 1 100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.settings .field label{font-size:11px}
.select{background:var(--room);border:1px solid var(--line);border-radius:9px;padding:8px;width:100%;min-width:0}
.hostbar{flex:1 1 100%;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px dashed var(--line);padding-top:10px;font-size:12px;color:var(--muted)}

/* chat */
.chat{min-width:0;min-height:0;display:none;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
@media (min-width:980px){.chat{display:flex}.chat .close,#chatBtn{display:none}}
.chat.open{display:flex;position:fixed;z-index:30;left:0;right:0;bottom:0;height:62%;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:0 -12px 40px rgba(0,0,0,.6);animation:sheet .22s ease-out}
@keyframes sheet{from{transform:translateY(40px);opacity:.4}}
.chat-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600}
.chat ol{list-style:none;margin:0;padding:10px 12px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain}
.msg{max-width:88%;align-self:flex-start;display:flex;flex-direction:column;gap:1px}
.msg .who{font-size:11px;color:var(--muted)}
.msg .txt{background:var(--room-2);border:1px solid var(--line);padding:6px 10px;border-radius:4px 12px 12px 12px;word-break:break-word}
.msg.mine{align-self:flex-end;align-items:flex-end}
.msg.mine .txt{background:var(--brass-soft);border-color:rgba(220,170,76,.35);border-radius:12px 4px 12px 12px}
.msg.sys{align-self:center;max-width:100%;font-size:11.5px;color:var(--muted);text-align:center}
.msg.sys.res{color:var(--ivory)}
.chat form{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
.chat form .input{padding:9px 11px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:29}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--ivory);color:var(--card-ink);padding:9px 15px;border-radius:12px;font-size:13px;font-weight:500;z-index:50;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:440px){
  .seat{width:78px}.av{width:38px;height:38px;font-size:16px}.av svg{left:-5px;top:-5px;width:48px;height:48px}
  .plate{min-width:66px;padding:1px 5px 2px}.plate .nm{max-width:68px;font-size:10.5px}.plate .stk{font-size:13.5px}
  .seat .hc{height:29px;margin-bottom:-11px}.card.sm{--w:21px}
  .brand{font-size:17px}.tablewrap{padding:32px 20px 40px}
  .emobtn{width:42px;height:42px;font-size:21px;right:0;top:0}.emopanel{right:0;top:50px}
  .top{gap:6px}.chip-code{font-size:15px;padding:2px 8px 2px 7px}.btn.sm{padding:5px 8px}.btn.icon{padding:4px 7px}
  .table{width:min(100%,380px);aspect-ratio:1/1.08}
  .tag.hn{display:none}
  #centerPlay.showing .blinds{display:none}
  #centerLobby{width:58%}
  .dock{padding:10px;gap:9px}
  .myhand .cards .card.lg{--w:44px}
  .actrow .btn{padding:11px 4px;font-size:14.5px}
  .myturn{font-size:14px}
}
@media (max-width:360px){.brand{font-size:0}.brand b{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">우리끼리 <b>홀덤</b></div>
    <span id="codeChip" class="chip-code" hidden role="button" tabindex="0" title="초대 링크 복사"><span class="dot" id="connDot"></span><span id="codeTxt"></span></span>
    <div class="spacer"></div>
    <button class="btn icon ghost" id="sndBtn" type="button" title="효과음 켜기/끄기" aria-label="효과음">🔊</button>
    <button class="btn sm" id="chatBtn" hidden>채팅<span id="unread" class="badge" hidden></span></button>
    <button class="btn sm ghost" id="leaveBtn" hidden>나가기</button>
  </header>

  <main id="home">
    <div class="home-inner">
      <div class="hero">
        <div class="fan" id="fan"></div>
        <h1>우리끼리 홀덤</h1>
        <p>방을 만들고 링크나 코드를 보내면 친구들이 바로 들어와요. 자리가 비면 AI를 앉혀서 같이 칠 수 있어요. 노리밋 텍사스 홀덤, 최대 8명.</p>
      </div>
      <div id="resumeBox" hidden></div>
      <form class="form" id="homeForm" autocomplete="off">
        <div class="field">
          <label for="nameIn">닉네임</label>
          <input class="input" id="nameIn" maxlength="10" placeholder="예: 민수">
        </div>
        <button class="btn brass" type="button" id="createBtn" style="padding:12px">방 만들기</button>
        <div class="or">또는 코드로 입장</div>
        <div class="row">
          <input class="input code" id="codeIn" maxlength="5" placeholder="ABCDE" autocapitalize="characters">
          <button class="btn ivory" type="submit" id="joinBtn">입장</button>
        </div>
        <div class="note"><b>친구 부르는 법</b> · 방을 만든 뒤 <b>초대 링크 복사</b>를 눌러 카톡으로 보내면, 친구는 링크를 열고 닉네임만 적으면 바로 같은 방에 들어와요. 혼자라면 방 안에서 <b>AI 추가</b>를 눌러 AI랑 칠 수 있어요.</div>
      </form>
    </div>
  </main>

  <main id="room" hidden>
    <section class="stage">
      <div class="tablewrap">
        <div class="table" id="table">
          <div class="felt"></div>
          <div class="stamp">NO LIMIT HOLD'EM</div>
          <div id="layer">
            <div class="dbtn" id="dbtn" hidden>D</div>
            <div class="center" id="centerPlay" hidden>
              <div class="pot num" id="pot"><small>POT</small><span id="potAmt">0</span></div>
              <div class="board" id="board"></div>
              <div id="statusBox"></div>
              <div class="blinds" id="blinds"></div>
            </div>
            <div class="center" id="centerLobby" hidden></div>
          </div>
        </div>
        <button class="emobtn" id="emoBtn" type="button" aria-label="이모티콘 반응" hidden>😀</button>
        <div class="emopanel" id="emoPanel" hidden></div>
        <div class="reveal" id="reveal" hidden></div>
      </div>
      <div class="dock" id="dock"></div>
    </section>
    <aside class="chat" id="chat" aria-label="채팅">
      <div class="chat-head">채팅 <button class="btn sm ghost close" id="chatClose" type="button">닫기</button></div>
      <ol id="chatList"></ol>
      <form id="chatForm" autocomplete="off">
        <input class="input" id="chatIn" maxlength="140" placeholder="메시지 입력">
        <button class="btn brass" type="submit">보내기</button>
      </form>
    </aside>
  </main>
  <div id="scrim" class="scrim" hidden></div>
  <div id="fx" aria-hidden="true"></div>
  <div id="toast" role="status"></div>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('ko-KR');
const store={
  get(k,ss){try{const v=(ss?sessionStorage:localStorage).getItem(k);return v?JSON.parse(v):null}catch(e){return null}},
  set(k,v,ss){try{(ss?sessionStorage:localStorage).setItem(k,JSON.stringify(v))}catch(e){}},
  del(k,ss){try{(ss?sessionStorage:localStorage).removeItem(k)}catch(e){}}
};
const rid=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,x=>'abcdefghijkmnpqrstuvwxyz23456789'[x%32]).join('')};
let toastT=0;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2300)}
function setHTML(el,html){if(el&&el._h!==html){el._h=html;el.innerHTML=html}}

/* ---------- 카드 & 족보 (내 패 표시용) ---------- */
const RANKS='23456789TJQKA';
const SUIT_CH={s:'♠︎',h:'♥︎',d:'♦︎',c:'♣︎'};
const RNAME=r=>r===8?'10':RANKS[r];
function eval5(cs){
  const rs=cs.map(c=>RANKS.indexOf(c[0])).sort((a,b)=>b-a);
  const flush=cs.every(c=>c[1]===cs[0][1]);const uniq=[...new Set(rs)];let sh=-1;
  if(uniq.length===5){if(uniq[0]-uniq[4]===4)sh=uniq[0];else if(uniq[0]===12&&uniq[1]===3)sh=3}
  const cnt={};rs.forEach(r=>cnt[r]=(cnt[r]||0)+1);
  const g=Object.entries(cnt).map(([r,c])=>[+r,c]).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);const gr=g.map(x=>x[0]);
  if(sh>=0&&flush)return[8,sh];if(g[0][1]===4)return[7,...gr];if(g[0][1]===3&&g[1][1]===2)return[6,...gr];
  if(flush)return[5,...rs];if(sh>=0)return[4,sh];if(g[0][1]===3)return[3,...gr];
  if(g[0][1]===2&&g[1][1]===2)return[2,...gr];if(g[0][1]===2)return[1,...gr];return[0,...rs];
}
function cmpScore(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]??-1)-(b[i]??-1);if(d)return d}return 0}
function bestHand(cards){let best=null,bc=null;const n=cards.length;const pick=(st,acc)=>{if(acc.length===5){const s=eval5(acc);if(!best||cmpScore(s,best)>0){best=s;bc=acc}return}for(let i=st;i<=n-(5-acc.length);i++)pick(i+1,[...acc,cards[i]])};pick(0,[]);return{score:best,cards:bc}}
function handName(s){if(!s)return'';const R=RNAME;switch(s[0]){case 8:return s[1]===12?'로열 플러시':`${R(s[1])} 스트레이트 플러시`;case 7:return `${R(s[1])} 포카드`;case 6:return `${R(s[1])} 풀하우스`;case 5:return `${R(s[1])} 하이 플러시`;case 4:return `${R(s[1])} 하이 스트레이트`;case 3:return `${R(s[1])} 트리플`;case 2:return `${R(s[1])}·${R(s[2])} 투페어`;case 1:return `${R(s[1])} 원페어`;default:return `${R(s[1])} 하이`}}
function cardHTML(c,size='',extra=''){
  if(c==='back')return `<div class="card back ${size} ${extra}"></div>`;
  if(!c)return `<div class="card slot ${size}"></div>`;
  const red=c[1]==='h'||c[1]==='d',s=SUIT_CH[c[1]];
  return `<div class="card ${red?'red':''} ${size} ${extra}"><span class="ix">${c[0]==='T'?'10':c[0]}<i>${s}</i></span><span class="pip">${s}</span></div>`;
}
const BETTING=new Set(['pre','flop','turn','river']);
const EMOJIS=['😂','👍','🔥','😱','😭','🤔','👏','😎','🙏','💸','🤬','❤️'];
const AV_COLORS=['#b5533c','#3f7f6a','#4f6fa8','#9a5a9e','#a8813a','#3d8c99','#8f4d63','#5f7d3a'];
const avColor=id=>{let h=0;for(const ch of String(id))h=(h*31+ch.charCodeAt(0))>>>0;return AV_COLORS[h%AV_COLORS.length]};
const initial=n=>{const t=String(n||'?').trim();return t?Array.from(t)[0].toUpperCase():'?'};

/* ---------- 효과음 (WebAudio로 직접 합성, 파일 없음) ---------- */
const SND={on:store.get('hd-snd')!==false,ctx:null,
  ensure(){if(!this.on)return;try{if(!this.ctx)this.ctx=new (window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume()}catch(e){}},
  tone(f,dur,type,gain,delay){const c=this.ctx;if(!c)return;const t=c.currentTime+(delay||0);const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain||.07,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.02)},
  noise(dur,gain,delay,freq){const c=this.ctx;if(!c)return;const t=c.currentTime+(delay||0);const b=c.createBuffer(1,Math.floor(c.sampleRate*dur),c.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=freq||3000;const g=c.createGain();g.gain.value=gain||.12;s.connect(f).connect(g).connect(c.destination);s.start(t)},
  play(name){if(!this.on||!this.ctx||this.ctx.state!=='running')return;
    if(name==='turn'){this.tone(880,.18,'sine',.08);this.tone(1320,.25,'sine',.07,.12)}
    else if(name==='chip'){this.noise(.05,.16,0,4200);this.noise(.05,.12,.06,3600)}
    else if(name==='deal'){this.noise(.06,.1,0,2200)}
    else if(name==='win'){[523,659,784,1047].forEach((f,i)=>this.tone(f,.28,'triangle',.06,i*.09))}
    else if(name==='split'){[587,740,587,740].forEach((f,i)=>this.tone(f,.2,'triangle',.05,i*.1))}
    else if(name==='pop'){this.tone(520,.12,'sine',.07);this.tone(780,.1,'sine',.05,.05)}
    else if(name==='fold'){this.noise(.08,.06,0,900)}
  }};
function syncSndBtn(){$('#sndBtn').textContent=SND.on?'🔊':'🔇'}
$('#sndBtn').onclick=()=>{SND.on=!SND.on;store.set('hd-snd',SND.on);syncSndBtn();if(SND.on){SND.ensure();SND.play('pop')}};
document.addEventListener('pointerdown',()=>SND.ensure(),{passive:true});
syncSndBtn();

/* ---------- 상태 & 연결 ---------- */
let PID=store.get('hd-pid',true);if(!PID){PID=rid(16);store.set('hd-pid',PID,true)}
const S={name:store.get('hd-name')||'',code:store.get('hd-room',true)||'',view:null,prev:null,conn:false,unread:0,chatOpen:false,bubbles:{},
  botLv:store.get('hd-botlv')||'normal',sqSeen:-1,turnEnd:0,turnTotal:0,nextEnd:0,pendSq:-1,actAt:0,raise:0,raiseSq:-1,dockSig:'',leaveArm:0,lobbyArm:0,resKey:''};
const net={es:null,handlers:{},
  on(ev,fn){this.handlers[ev]=fn},
  connect(){
    if(this.es)this.es.close();
    const es=this.es=new EventSource('/events?pid='+encodeURIComponent(PID));
    es.onopen=()=>{S.conn=true;renderTop();if(S.code)net.send('join',{code:S.code,name:S.name});if(!S.view)render()};
    es.onerror=()=>{S.conn=false;renderTop()};
    for(const ev of ['state','chat','chatlog','nojoin','err','react'])es.addEventListener(ev,e=>{let d;try{d=JSON.parse(e.data)}catch(_){return}const fn=net.handlers[ev];if(fn)fn(d)});
  },
  get connected(){return !!this.es&&this.es.readyState===1},
  send(type,data){
    fetch('/api',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pid:PID,type,...(data||{})}),keepalive:true})
      .catch(()=>toast('서버에 보내지 못했어요. 연결 상태를 확인해 주세요'));
  }
};
net.connect();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(!net.es||net.es.readyState===2)net.connect();updateTitle()}});
setInterval(()=>{if(S.code&&net.connected)net.send('ping')},240000);

net.on('state',v=>{
  const prev=S.view,first=!prev;
  S.prev=prev;S.view=v;S.code=v.code;
  store.set('hd-room',v.code,true);store.set('hd-last',{code:v.code,pid:PID,at:Date.now()});
  if(location.hash!=='#'+v.code)history.replaceState(null,'','#'+v.code);
  if(first)showScreen('room');
  if(v.h.sq!==S.sqSeen){S.sqSeen=v.h.sq;S.raiseSq=-1}
  S.turnEnd=v.h.tl>=0?Date.now()+v.h.tl:0;S.turnTotal=v.h.tt||0;
  S.nextEnd=v.h.nx>=0?Date.now()+v.h.nx:0;
  if(!first)sounds(prev,v);
  render();
});
net.on('chatlog',list=>{$('#chatList').innerHTML='';(list||[]).forEach(m=>addChatItem(m,true))});
net.on('chat',m=>{
  addChatItem(m,false);
  if(m.sid&&!m.sys)showBubble(m.sid,`<div class="bubble">${esc(m.t)}</div>`,5000);
});
net.on('react',r=>{
  if(!EMOJIS.includes(r.e))return;
  bigEmoji(r.e,r.n);
  if(r.sid)showBubble(r.sid,`<div class="bubble emo">${r.e}</div>`,2600);
  SND.play('pop');
});
net.on('nojoin',msg=>{toast(msg);store.del('hd-room',true);S.code='';S.view=null;showScreen('home');renderHome()});
net.on('err',msg=>{toast(msg);S.pendSq=-1;renderDock(true)});

function myId(){const v=S.view;return v&&v.me>=0?v.seats[v.me].id:''}
function sendAction(a,x){const v=S.view;if(!v||v.me<0||v.h.tu!==v.me||S.pendSq===v.h.sq)return;S.pendSq=v.h.sq;S.actAt=Date.now();net.send('act',{a,x:x||0,sq:v.h.sq});SND.play(a==='fold'?'fold':(a==='check'?'deal':'chip'));renderDock(true)}
function hostCmd(cmd,arg){net.send('host',{cmd,arg})}

function sounds(p,v){
  const h=v.h,ph=p.h;
  if(h.bd.length>ph.bd.length)SND.play('deal');
  if(h.no!==ph.no&&h.st==='pre')SND.play('deal');
  const bets=v.seats.reduce((a,s)=>a+s.b,0),pb=p.seats.reduce((a,s)=>a+s.b,0);
  if(h.no===ph.no&&bets>pb&&!(v.me>=0&&S.pendSq===ph.sq))SND.play('chip');
  if(v.me>=0&&h.tu===v.me&&BETTING.has(h.st)&&!(ph.tu===v.me&&ph.sq===h.sq)){SND.play('turn');try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}}
  if(h.st==='show'&&ph.st!=='show'&&h.res){const mine=v.me>=0&&h.res.pots.some(pt=>pt.win.includes(v.seats[v.me].id));const split=h.res.pots[0]&&h.res.pots[0].split;if(mine)SND.play(split?'split':'win')}

function seatGeom(k,n){
  const ang=Math.PI/2+k*2*Math.PI/Math.max(n,2);const c=Math.cos(ang),s=Math.sin(ang);
  return{x:50+45*c,y:50+43*s,bx:50+27*c,by:50+25*s,dx:50+33*c-15*s,dy:50+31*s+12*c};
}
const seatEls=new Map();

  const bet=document.createElement('div');bet.className='bet';bet.innerHTML='<span class="chipico"></span><span class="amt"></span>';
  const o={root,bet,bub:root.querySelector('.bub'),hc:root.querySelector('.hc'),av:root.querySelector('.av'),ini:root.querySelector('.ini'),ring:root.querySelector('svg'),nm:root.querySelector('.nm'),stk:root.querySelector('.stk'),tg:root.querySelector('.tg'),amt:bet.querySelector('.amt'),wonKey:''};
  const layer=$('#layer');layer.appendChild(bet);layer.appendChild(root);
  return o;
}
function hiSet(v){const r=v.h.res;return v.h.st==='show'&&r&&r.kind==='show'?new Set(r.hi||[]):null}
function renderSeatsOnly(){if(S.view)renderSeats(S.view)}
function renderSeats(v){
  const n=v.seats.length,myI=v.me,base=myI<0?0:myI,h=v.h,now=Date.now(),lobby=v.status==='lobby';
  const ids=new Set(v.seats.map(s=>s.id));

  const hi=hiSet(v);
  v.seats.forEach((s,i)=>{
    let o=seatEls.get(s.id);if(!o){o=makeSeat();seatEls.set(s.id,o)}
    const g=seatGeom((i-base+n)%n,n);
    o.root.style.left=g.x+'%';o.root.style.top=g.y+'%';o.root.dataset.i=i;
    const isTurn=h.tu===i&&BETTING.has(h.st)&&v.status==='playing';
    const won=s.w>0&&h.st==='show';
    o.root.className='seat'+(i===myI?' me':'')+(isTurn?' turn':'')+(s.f?' folded':'')+(s.o?' out':'')+(s.aw?' aw':'')+(won?' win':'');
    o.av.style.setProperty('--c',avColor(s.id));
    o.ini.textContent=s.bot?'🤖':initial(s.n);o.av.classList.toggle('bot',!!s.bot);if(s.bot)o.root.classList.add('isbot');
    o.nm.textContent=s.n+(i===myI?' (나)':'');
    o.stk.textContent=fmt(s.s);
    let crown=o.av.querySelector('.crown');
    if(s.host&&!crown){crown=document.createElement('span');crown.className='crown';crown.textContent='👑';crown.title='방장';o.av.appendChild(crown)}
    else if(!s.host&&crown)crown.remove();
    // 카드
    let cards='';
    if(!lobby&&s.ih&&(!s.f||(h.st==='show'&&s.sh&&s.sh.length))){
      if(s.sh&&s.sh.length)cards=s.sh.map(c=>cardHTML(c,'sm',(hi?(hi.has(c)?'hl':'dim'):'')+' flip')).join('');
      else if(i!==myI)cards=cardHTML('back','sm','deal')+cardHTML('back','sm','deal');
    }
    setHTML(o.hc,cards);
    // 태그
    let tag='';
    if(lobby)tag=s.bot?`<span class="tag ai">AI · ${esc(s.lv)}</span>`:(s.aw?'<span class="tag muted">연결 끊김</span>':'');
    else if(won)tag=`<span class="tag win">+${fmt(s.w)}</span>`;
    else if(s.o)tag='<span class="tag muted">탈락</span>';
    else if(s.aw)tag='<span class="tag muted">자리 비움</span>';
    else if(!s.ih&&v.status==='playing')tag='<span class="tag muted">대기</span>';
    else if(s.la)tag=`<span class="tag${s.la==='폴드'?' muted':(s.la==='올인'?' allin':'')}">${esc(s.la)}</span>`;
    if(h.st==='show'&&s.hn&&s.sh)tag+=`<span class="tag hn">${esc(s.hn)}</span>`;
    setHTML(o.tg,tag);
    // 이긴 칩 떠오르기
    const wk=won?h.no+':'+s.w:'';
    if(wk&&o.wonKey!==wk){const gdiv=document.createElement('div');gdiv.className='gain';gdiv.textContent='+'+fmt(s.w);o.root.appendChild(gdiv);setTimeout(()=>gdiv.remove(),1900)}
    o.wonKey=wk;
    // 말풍선
    const b=S.bubbles[s.id];setHTML(o.bub,b&&b.until>now?b.html:'');
    // 베팅 칩
    o.bet.style.left=g.bx+'%';o.bet.style.top=g.by+'%';
    o.bet.hidden=!(s.b>0);o.amt.textContent=fmt(s.b);
  });
  const db=$('#dbtn');

}

function revealHTML(v){
  const h=v.h,r=h.res;if(!r)return '';
  const main=r.pots[0];if(!main)return '';
  const winners=main.win.map(id=>v.seats.find(s=>s.id===id)).filter(Boolean);

  const title=main.split?'무승부!':(iWon?'내가 이겼어요!':`${esc(main.names[0])} 승리`);
  const many=winners.length>2;
  const block=w=>{
    const shown=w.sh&&w.sh.length;
    const best=new Set(w.bc||[]);
    let inner='';
    if(shown){
      inner+=`<div class="hc2">${w.sh.map(c=>cardHTML(c,'',(best.size&&!best.has(c)?'dim ':'')+'flip')).join('')}</div>`;
      if(w.hn)inner+=`<div class="hn">${esc(w.hn)}${!main.split&&main.note&&r.kind==='show'?`<em>${esc(main.note)}</em>`:''}</div>`;
      if(w.bc&&w.bc.length){const sorted=[...w.bc].sort((a,b)=>RANKS.indexOf(b[0])-RANKS.indexOf(a[0]));inner+=`<div class="b5" title="최종 5장">${sorted.map(c=>cardHTML(c,'sm',w.sh.includes(c)?'hl':'')).join('')}</div>`}
    }else{
      inner+=`<div class="hc2">${cardHTML('back')}${cardHTML('back')}</div><div class="hidden">${w.id===meId?'아래 <b>내 패 보여주기</b>로 공개할 수 있어요':'카드를 공개하지 않았어요'}</div>`;
    }
    const share=main.shares[main.win.indexOf(w.id)];
    return `<div class="w"><div class="wn">👑 ${esc(w.n)}${w.id===meId?' <small>(나)</small>':''}</div>${inner}<div class="amt">+${fmt(w.w||share)}</div></div>`;
  };
  const side=r.pots.slice(1).filter(p=>!p.solo).map(p=>p.split?`${esc(p.name)} 무승부 · ${p.names.map(esc).join(', ')} 나눔`:`${esc(p.name)} · ${esc(p.names[0])} <b>+${fmt(p.amt)}</b>`).join('<br>');
  const sub=r.kind==='fold'?'모두 폴드':(main.split?`${fmt(main.amt)}을 ${winners.length}명이 나눠 가져요`:'');
  return `<div class="rv${main.split?' split':''}${many?' many':''}" role="dialog" aria-label="핸드 결과"><div class="rk">${title}</div>${sub?`<div class="foot">${sub}</div>`:''}<div class="ws">${winners.map(block).join('')}</div><div class="foot">${side?side+'<br>':''}<span class="nx"></span> · 화면을 누르면 닫혀요</div></div>`;
}

        <div class="field"><label for="setTimer">턴 시간</label><select class="select" id="setTimer">${opt([20,30,60,0],set.timer,x=>x?x+'초':'무제한')}</select></div>
      </div>
      <div class="waitmsg">${online<2?'친구를 초대하거나 <b>AI 추가</b>를 누르면 시작할 수 있어요':'<b>'+online+'명</b> 준비 완료'+(bots.length?` (AI ${bots.length}명 포함)`:'')}</div>
      <button class="btn brass" id="startBtn" style="padding:12px 22px"${online<2?' disabled':''}>게임 시작</button>`;
    }else{
      html=`<div class="waitmsg"><b>${esc(me?me.n:S.name)}</b>님, 자리에 앉았어요. 방장이 게임을 시작하길 기다리는 중이에요.<br>시작 칩 ${fmt(set.stack)} · 블라인드 ${set.sb}/${set.bb} · 턴 ${set.timer?set.timer+'초':'무제한'}</div>`;
    }
  }else if(v.status==='over'){
    html=myHand()+(v.isHost?`<div class="waitmsg"><b>${esc(v.champ)}</b>님이 모든 칩을 가져갔어요.</div><button class="btn brass" id="lobbyBtn2">새 게임 준비</button>`:`<div class="waitmsg">방장이 새 게임을 준비할 때까지 기다려 주세요.</div>`);
  }else{
    html=myHand();
    const myTurn=me&&h.tu===i&&BETTING.has(h.st)&&S.pendSq!==h.sq;
    if(myTurn){
      const toCall=Math.max(0,h.cb-me.b),maxT=me.b+me.s;
      const others=v.seats.filter((o,k)=>k!==i&&o.ih&&!o.f&&!o.a).length;
      const canRaise=!me.ac&&maxT>h.cb&&others>0;
      const minT=h.cb===0?Math.min(set.bb,maxT):Math.min(h.cb+h.mr,maxT);
      if(S.raiseSq!==h.sq){S.raise=minT;S.raiseSq=h.sq}
      S.raise=Math.max(minT,Math.min(maxT,S.raise));
      const callLbl=toCall<=0?'체크':(toCall>=me.s?`올인 ${fmt(me.s)}`:`콜 ${fmt(toCall)}`);
      const rLbl=(h.cb===0?'벳 ':'레이즈 ')+fmt(S.raise)+(S.raise>=maxT?' (올인)':'');
      html+=`<div class="actions">
        <div class="myturn">내 차례 <span class="timer" id="timerTxt"></span></div>
        <div class="actrow">
          <button class="btn ghost" data-act="fold">폴드<kbd>F</kbd></button>
          <button class="btn ivory" data-act="${toCall<=0?'check':'call'}">${callLbl}<kbd>C</kbd></button>
          <button class="btn brass" data-act="raise" id="raiseBtn"${canRaise?'':' disabled'}>${canRaise?rLbl:'레이즈 불가'}</button>
        </div>
        ${canRaise&&minT<maxT?`<div class="raiserow">
          <button class="btn sm" data-step="-1" aria-label="줄이기">−</button>
          <input type="range" id="raiseRange" min="${minT}" max="${maxT}" step="1" value="${S.raise}" aria-label="베팅 금액">
          <button class="btn sm" data-step="1" aria-label="늘리기">+</button>
          <div class="presets"><button class="btn sm" data-pre="min">최소</button><button class="btn sm" data-pre="half">½팟</button><button class="btn sm" data-pre="pot">팟</button><button class="btn sm" data-pre="all">올인</button></div>
        </div>`:''}
      </div>`;
    }else{
      let w='';
      if(!me)w='관전 중이에요. 자리 8개가 모두 찼어요.';
      else if(me.o)w='칩을 모두 잃었어요. 방장이 리바이를 해 주면 다시 참여할 수 있어요.';
      else if(!me.ih)w='다음 핸드부터 참여해요.';
      else if(h.st==='show')w=(me.ih&&hole&&!(me.sh&&me.sh.length))?'핸드가 끝났어요. <button class="btn sm brass" id="revealBtn" type="button">내 패 보여주기</button>':'핸드가 끝났어요.';
      else if(me.f)w='이번 핸드는 폴드했어요.';
      else if(S.pendSq===h.sq)w='액션을 보냈어요…';
      else if(h.tu>=0&&v.seats[h.tu])w=v.seats[h.tu].bot?`<b>${esc(v.seats[h.tu].n)}</b>가 생각 중이에요…`:`<b>${esc(v.seats[h.tu].n)}</b>님이 고민 중이에요.`;
      else w='카드를 펼치는 중…';
      html+=`<div class="waitmsg">${w} <span class="timer" id="timerTxt"></span></div>`;
    }
    if(v.isHost){
      const anyOut=v.seats.some(s=>s.o),armed=S.lobbyArm>Date.now();
      html+=`<div class="hostbar">방장 메뉴
        ${h.st==='show'||h.st==='idle'?'<button class="btn sm" id="nextBtn">바로 다음 핸드</button>':''}
        ${anyOut?'<button class="btn sm" id="rebuyBtn">탈락자 리바이</button>':''}
        ${v.seats.length<8?'<button class="btn sm" id="addBot2">🤖 AI 추가</button>':''}
        <button class="btn sm ghost${armed?' warn':''}" id="lobbyBtn">${armed?'정말 게임 끝내기':'게임 끝내고 대기실로'}</button></div>`;
    }
  }
  dock.innerHTML=html;bindDock();tick();
}
function bindDock(){
  const v=S.view;const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn};
  on('startBtn',()=>hostCmd('start'));
  on('revealBtn',()=>{net.send('reveal');const b=$('#revealBtn');if(b)b.disabled=true});
  on('addBot',()=>hostCmd('addbot',{lv:S.botLv}));on('addBot2',()=>hostCmd('addbot',{lv:S.botLv}));
  const bl=$('#botLv');if(bl)bl.onchange=()=>{S.botLv=bl.value;store.set('hd-botlv',S.botLv)};
  document.querySelectorAll('#dock [data-kick]').forEach(b=>b.onclick=()=>hostCmd('kickbot',{id:b.dataset.kick}));on('nextBtn',()=>hostCmd('next'));on('rebuyBtn',()=>hostCmd('rebuy'));on('lobbyBtn2',()=>hostCmd('lobby'));
  on('lobbyBtn',()=>{if(S.lobbyArm>Date.now()){S.lobbyArm=0;hostCmd('lobby')}else{S.lobbyArm=Date.now()+3000;renderDock(true);setTimeout(()=>renderDock(true),3100)}});
  const ss=$('#setStack');if(ss)ss.onchange=()=>hostCmd('set',{stack:+ss.value});
  const sb=$('#setBlind');if(sb)sb.onchange=()=>{const[a,b]=sb.value.split('/').map(Number);hostCmd('set',{sb:a,bb:b})};
  const st=$('#setTimer');if(st)st.onchange=()=>hostCmd('set',{timer:+st.value});
  document.querySelectorAll('#dock [data-act]').forEach(b=>b.onclick=()=>{const a=b.dataset.act;sendAction(a,a==='raise'?S.raise:0)});
  const rr=$('#raiseRange');
  const upd=()=>{const me=v.seats[v.me],maxT=me.b+me.s;const rb=$('#raiseBtn');if(rb)rb.textContent=(v.h.cb===0?'벳 ':'레이즈 ')+fmt(S.raise)+(S.raise>=maxT?' (올인)':'');if(rr)rr.value=S.raise};
  if(rr)rr.oninput=()=>{S.raise=+rr.value;upd()};
  document.querySelectorAll('#dock [data-step]').forEach(b=>b.onclick=()=>{if(!rr)return;S.raise=Math.max(+rr.min,Math.min(+rr.max,S.raise+v.set.bb*(+b.dataset.step)));upd()});
  document.querySelectorAll('#dock [data-pre]').forEach(b=>b.onclick=()=>{
    if(!rr)return;const me=v.seats[v.me],h=v.h;
    const total=(h.pot||0)+v.seats.reduce((a,s)=>a+(s.b||0),0),toCall=Math.max(0,h.cb-me.b);
    const p=b.dataset.pre;let t;
    if(p==='min')t=+rr.min;else if(p==='all')t=+rr.max;else if(p==='pot')t=h.cb+total+toCall;else t=h.cb+Math.floor((total+toCall)/2);
    S.raise=Math.max(+rr.min,Math.min(+rr.max,t));upd();
  });
}
// 100ms마다 타이머 링·숫자만 갱신 (전체 다시 그리지 않음)
function tick(){
  const v=S.view;if(!v)return;const now=Date.now(),h=v.h;
  if(S.pendSq===h.sq&&now-S.actAt>4000){S.pendSq=-1;renderDock(true)}
  const turnOn=v.status==='playing'&&h.tu>=0&&BETTING.has(h.st)&&S.turnEnd>0&&S.turnTotal>0;
  const tt=$('#timerTxt');
  if(turnOn){
    const left=Math.max(0,S.turnEnd-now),frac=left/S.turnTotal;
    const o=v.seats[h.tu]&&seatEls.get(v.seats[h.tu].id);
    if(o){o.ring.querySelector('circle').style.strokeDashoffset=(169.6*(1-frac)).toFixed(1);o.ring.classList.toggle('low',left<6000)}
    if(tt)tt.textContent=`${Math.ceil(left/1000)}초`;
  }else if(tt)tt.textContent='';
  const nxt=(v.status==='playing'&&h.st==='show'&&S.nextEnd>now)?`다음 핸드 ${Math.ceil((S.nextEnd-now)/1000)}초`:'';
  const nt=document.getElementById('nextTxt');if(nt)nt.textContent='';
  document.querySelectorAll('.result .nx,.rv .nx').forEach(nx=>{const t=nx.closest('.rv')?(nxt||'곧 다음 핸드'):nxt;if(nx.textContent!==t)nx.textContent=t});
}
setInterval(tick,100);
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,select,textarea')||e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key.toLowerCase();
  const b=k==='f'?document.querySelector('#dock [data-act="fold"]'):k==='c'?document.querySelector('#dock [data-act="call"],#dock [data-act="check"]'):k==='r'?$('#raiseBtn'):null;
  if(b&&!b.disabled){e.preventDefault();b.click()}
});

/* ---------- 초대 링크 ---------- */
function inviteLink(){return location.origin+location.pathname+'#'+S.code}
function copyLink(){
  const link=inviteLink();
  const fallback=()=>{const el=$('#bigCode')||$('#codeTxt');try{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}catch(e){}toast('복사가 안 되면 코드 '+S.code+'를 직접 알려 주세요')};
  try{navigator.clipboard.writeText(link).then(()=>toast('초대 링크를 복사했어요. 카톡에 붙여 넣어 보내 주세요'),fallback)}catch(e){fallback()}
}

/* ---------- 홈 ---------- */
function renderHome(){
  $('#nameIn').value=S.name;
  const fan=$('#fan');
  if(!fan.childElementCount)fan.innerHTML=['As','Kh','Qd'].map(c=>cardHTML(c,'lg')).join('');
  [...fan.children].forEach((el,k)=>{el.style.transform=`translateX(-50%) rotate(${(k-1)*13}deg)`});
  const hc=(location.hash||'').replace('#','').toUpperCase();
  if(/^[A-Z0-9]{5}$/.test(hc)&&!$('#codeIn').value)$('#codeIn').value=hc;
  const rb=$('#resumeBox');rb.hidden=true;rb.innerHTML='';
  const last=store.get('hd-last');
  if(last&&last.code&&Date.now()-last.at<12*3600e3){
    rb.hidden=false;
    rb.innerHTML=`<div class="resume"><span>방 <b class="num" style="color:var(--brass);letter-spacing:.12em">${esc(last.code)}</b>에 다시 들어가기</span><span class="row"><button class="btn sm brass" id="resumeBtn" type="button">입장</button><button class="btn sm ghost" id="dropBtn" type="button">지우기</button></span></div>`;
    $('#resumeBtn').onclick=()=>{if(!takeName())return;if(last.pid&&last.pid!==PID){PID=last.pid;store.set('hd-pid',PID,true);S.code=last.code;resetRoomUI();showScreen('room');render();net.connect();return}joinRoom(last.code)};
    $('#dropBtn').onclick=()=>{store.del('hd-last');renderHome()};
  }
}
function takeName(){
  const n=$('#nameIn').value.trim().slice(0,10);
  if(!n){$('#nameIn').focus();toast('닉네임을 먼저 적어 주세요');return false}
  S.name=n;store.set('hd-name',n);return true;
}
function resetRoomUI(){S.view=null;S.prev=null;S.unread=0;S.sqSeen=-1;S.pendSq=-1;S.dockSig='';S.bubbles={};S.resKey='';$('#chatList').innerHTML='';$('#board').innerHTML='';$('#emoPanel').hidden=true}
function joinRoom(code){
  resetRoomUI();S.code=code;showScreen('room');render();
  if(net.connected)net.send('join',{code,name:S.name});
}
function leaveRoom(){
  net.send('leave');store.del('hd-room',true);store.del('hd-last');
  S.code='';resetRoomUI();history.replaceState(null,'',location.pathname);
  showScreen('home');renderHome();renderTable();
}

/* ---------- 이벤트 ---------- */
$('#createBtn').onclick=()=>{
  if(!takeName())return;
  if(!net.connected){toast('서버에 연결하는 중이에요. 잠시 후 다시 눌러 주세요');return}
  resetRoomUI();S.code='';showScreen('room');render();
  net.send('create',{name:S.name});
};
$('#homeForm').onsubmit=e=>{e.preventDefault();const c=$('#codeIn').value.trim().toUpperCase();if(!/^[A-Z0-9]{5}$/.test(c)){toast('5자리 방 코드를 입력해 주세요');return}if(!takeName())return;joinRoom(c)};
$('#codeIn').oninput=e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'')};
$('#codeChip').onclick=copyLink;
$('#codeChip').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();copyLink()}};
$('#leaveBtn').onclick=()=>{if(S.leaveArm>Date.now()){S.leaveArm=0;leaveRoom()}else{S.leaveArm=Date.now()+3000;renderTop();setTimeout(renderTop,3100)}};
function syncChatSheet(){$('#chat').classList.toggle('open',S.chatOpen);$('#scrim').hidden=!S.chatOpen}
$('#chatBtn').onclick=()=>{S.chatOpen=true;S.unread=0;syncChatSheet();renderTop();const ol=$('#chatList');ol.scrollTop=ol.scrollHeight};
$('#chatClose').onclick=$('#scrim').onclick=()=>{S.chatOpen=false;syncChatSheet()};
$('#chatForm').onsubmit=e=>{e.preventDefault();const inp=$('#chatIn');const t=inp.value.trim();if(!t)return;net.send('chat',{t});inp.value=''};

if(S.code){showScreen('room');render()}else{showScreen('home');renderHome()}
const hc0=(location.hash||'').replace('#','').toUpperCase();
if(!S.code&&/^[A-Z0-9]{5}$/.test(hc0)){toast('닉네임을 적고 입장을 눌러 주세요');setTimeout(()=>$('#nameIn').focus(),300)}
</script>
