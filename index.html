<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1513">
<title>우리끼리 홀덤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen card room — felt table stage with a docked action rail below; chat column on wide screens, bottom sheet on phones */
:root{
  --room:#0c1513; --room-2:#13201d; --panel:#16241f; --felt:#1e5a49; --felt-deep:#0e3329;
  --wood:#4a2f1b; --wood-dark:#2a190e; --brass:#d9a849; --brass-ink:#2a1d07; --brass-soft:rgba(217,168,73,.18);
  --ivory:#f6efdc; --card-ink:#1d1b18; --suit-red:#c23a2c; --text:#e8eee9; --muted:#8ea79d; --line:rgba(232,238,233,.12);
  --danger:#e4705f; --ok:#6cc995;
  --f-display:"Black Han Sans","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--room);color:var(--text);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--room)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}

#app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:10px;padding-block:10px;flex:0 0 auto;min-height:52px}
.brand{font-family:var(--f-display);font-size:19px;letter-spacing:.02em;color:var(--ivory);white-space:nowrap}
.brand b{color:var(--brass);font-weight:400}
.spacer{flex:1}
.chip-code{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--brass-soft);background:var(--room-2);border-radius:999px;padding:3px 10px 3px 8px;color:var(--brass);font-family:var(--f-num);font-size:17px;letter-spacing:.12em}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.dot.on{background:var(--ok)}
.btn{border:1px solid var(--line);background:var(--room-2);border-radius:10px;padding:8px 14px;font-weight:500;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.brass{background:var(--brass);color:var(--brass-ink);border-color:transparent;font-weight:600}
.btn.ivory{background:var(--ivory);color:var(--card-ink);border-color:transparent;font-weight:600}
.btn.ghost{background:transparent}
.btn.warn{border-color:var(--danger);color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:4px}

/* ---------- home ---------- */
#home{flex:1;overflow:auto;display:grid;place-items:center;padding-block:12px 28px}
.home-inner{width:100%;max-width:440px;display:flex;flex-direction:column;gap:22px}
.hero{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.fan{position:relative;height:120px;width:200px}
.fan .card{position:absolute;left:50%;bottom:0;transform-origin:50% 120%}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:40px;line-height:1.1;margin:0;color:var(--ivory);text-wrap:balance}
.hero p{margin:0;color:var(--muted);max-width:32ch}
.form{display:flex;flex-direction:column;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted);letter-spacing:.04em}
.input{background:var(--room);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;width:100%;min-width:0}
.input.code{font-family:var(--f-num);letter-spacing:.3em;text-transform:uppercase;font-size:20px}
.row{display:flex;gap:8px;align-items:stretch}
.row > .input{flex:1}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.note{font-size:12.5px;color:var(--muted);line-height:1.6;border-top:1px dashed var(--line);padding-top:12px}
.note b{color:var(--text);font-weight:500}
.alert{background:rgba(228,112,95,.12);border:1px solid rgba(228,112,95,.4);color:var(--text);border-radius:12px;padding:12px 14px;font-size:13px}
.resume{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--brass-soft);border:1px solid rgba(217,168,73,.35);border-radius:12px;padding:10px 12px}

/* ---------- room ---------- */
#room{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-bottom:10px}
@media (min-width:960px){#room{grid-template-columns:minmax(0,1fr) 320px}}
.stage{min-width:0;min-height:0;display:flex;flex-direction:column;gap:10px;overflow:auto}
.tablewrap{flex:1;min-height:300px;display:grid;place-items:center;padding:34px 30px 40px}
.table{position:relative;width:min(100%,460px);aspect-ratio:5/6;min-width:250px}
@media (min-width:700px){.table{aspect-ratio:16/10;width:min(100%,900px);width:min(100%,calc((100vh - 320px)*1.6),900px)}}
.felt{position:absolute;inset:0;border-radius:44%/36%;background:radial-gradient(120% 90% at 50% 40%,var(--felt) 0%,var(--felt-deep) 78%);
  border:clamp(10px,2.6vw,16px) solid var(--wood);box-shadow:0 0 0 2px var(--wood-dark),inset 0 0 0 1px rgba(0,0,0,.4),inset 0 10px 40px rgba(0,0,0,.35),0 24px 60px rgba(0,0,0,.45)}
@media (min-width:700px){.felt{border-radius:999px}}
.felt::after{content:"";position:absolute;inset:13%;border-radius:inherit;border:1.5px solid rgba(217,168,73,.22)}
.stamp{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-family:var(--f-display);color:rgba(246,239,220,.07);font-size:clamp(18px,4vw,30px);white-space:nowrap;pointer-events:none}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76%;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.pot{font-family:var(--f-num);font-size:20px;color:var(--brass);letter-spacing:.04em}
.pot small{font-family:var(--f-body);font-size:11px;color:var(--muted);letter-spacing:.08em;margin-right:6px}
.board{display:flex;gap:4px;justify-content:center}
.status{font-size:13px;color:var(--ivory);min-height:20px;text-wrap:balance}
.status.big{font-family:var(--f-display);font-size:22px;color:var(--brass)}
.blinds{font-size:11px;color:var(--muted);letter-spacing:.06em}
.lobby-code{font-family:var(--f-num);font-size:clamp(34px,9vw,52px);letter-spacing:.22em;color:var(--ivory);line-height:1;padding-left:.22em}
.lobby-sub{font-size:12px;color:var(--muted)}

.card{--w:44px;width:var(--w);height:calc(var(--w)*1.4);border-radius:calc(var(--w)*.12);background:var(--ivory);color:var(--card-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.35);flex:0 0 auto;position:relative}
.card .r{font-family:var(--f-num);font-weight:700;font-size:calc(var(--w)*.5)}
.card .s{font-size:calc(var(--w)*.42);margin-top:1px}
.card.red{color:var(--suit-red)}
.card.back{background:repeating-linear-gradient(45deg,var(--wood) 0 4px,#5b3a21 4px 8px);border:2px solid var(--ivory)}
.card.slot{background:transparent;border:1.5px dashed rgba(246,239,220,.18);box-shadow:none}
.card.sm{--w:26px}.card.md{--w:clamp(32px,7.6vw,46px)}.card.lg{--w:clamp(52px,14vw,64px)}
.card.dim{filter:brightness(.55)}
.card.deal{animation:deal .32s ease-out both}
@keyframes deal{from{transform:translateY(-14px) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}

.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:92px;z-index:2}
.minis{display:flex;gap:2px;height:37px;align-items:flex-end;margin-bottom:-8px;position:relative;z-index:0}
.plate{--p:0;position:relative;z-index:1;background:var(--room-2);border:1.5px solid var(--line);border-radius:12px;padding:4px 8px;min-width:82px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.plate .nm{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:82px}
.plate .stk{font-family:var(--f-num);font-size:15px;color:var(--brass);line-height:1.1}
.seat.me .plate{border-color:rgba(246,239,220,.45)}
.seat.turn .plate{border-color:var(--brass);background:conic-gradient(var(--brass-soft) calc(var(--p)*1turn),var(--room-2) 0);box-shadow:0 0 0 3px rgba(217,168,73,.25),0 4px 16px rgba(0,0,0,.5)}
.seat.folded .plate,.seat.out .plate{opacity:.45}
.seat.win .plate{border-color:var(--ok);box-shadow:0 0 0 3px rgba(108,201,149,.3)}
.tag{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--ivory);color:var(--card-ink);white-space:nowrap;letter-spacing:.02em}
.tag.muted{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500}
.tag.win{background:var(--ok);color:#0c2016}
.tag.hn{background:transparent;color:var(--ivory);border:1px solid rgba(246,239,220,.3);font-weight:500}
.bubble{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--ivory);color:var(--card-ink);font-size:12px;padding:5px 9px;border-radius:10px;max-width:150px;width:max-content;word-break:break-all;box-shadow:0 4px 12px rgba(0,0,0,.4);animation:pop .2s ease-out;z-index:5}
.bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:var(--ivory)}
@keyframes pop{from{transform:translateX(-50%) scale(.8);opacity:0}to{transform:translateX(-50%);opacity:1}}
.bet{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:4px;font-family:var(--f-num);font-size:14px;color:var(--ivory);z-index:1;white-space:nowrap}
.chipico{width:14px;height:14px;border-radius:50%;background:var(--brass);box-shadow:inset 0 0 0 2.5px var(--brass-ink),inset 0 0 0 4px var(--brass)}
.dbtn{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:var(--ivory);color:var(--card-ink);font-family:var(--f-num);font-weight:700;font-size:13px;display:grid;place-items:center;box-shadow:0 2px 5px rgba(0,0,0,.4);z-index:1}

/* dock */
.dock{flex:0 0 auto;position:sticky;bottom:0;z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;min-height:96px}
.myhand{display:flex;align-items:center;gap:10px;min-width:0}
.myhand .cards{display:flex;gap:5px}
.myhand .meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.myhand .meta .lbl{font-size:11px;color:var(--muted);letter-spacing:.06em}
.myhand .meta .val{font-weight:600;color:var(--ivory)}
.myhand .meta .stk{font-family:var(--f-num);color:var(--brass);font-size:17px}
.actions{flex:1 1 300px;display:flex;flex-direction:column;gap:8px;min-width:0}
.actrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.actrow .btn{padding:12px 6px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.raiserow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.raiserow input[type=range]{flex:1 1 140px;accent-color:var(--brass);min-width:0}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.waitmsg{flex:1 1 220px;color:var(--muted);font-size:13px}
.waitmsg b{color:var(--ivory);font-weight:500}
.timer{font-family:var(--f-num);color:var(--brass);font-size:15px}
.settings{flex:1 1 100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.settings .field label{font-size:11px}
.select{background:var(--room);border:1px solid var(--line);border-radius:9px;padding:8px;width:100%;min-width:0}
.hostbar{flex:1 1 100%;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px dashed var(--line);padding-top:10px;font-size:12px;color:var(--muted)}
.full{flex:1 1 100%}

/* chat */
.chat{min-width:0;min-height:0;display:none;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
@media (min-width:960px){.chat{display:flex}.chat .close,#chatBtn{display:none}}
.chat.open{display:flex;position:fixed;z-index:30;left:0;right:0;bottom:0;height:62%;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:0 -12px 40px rgba(0,0,0,.6)}
.chat-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600}
.chat ol{list-style:none;margin:0;padding:10px 12px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.msg{max-width:88%;align-self:flex-start;display:flex;flex-direction:column;gap:1px}
.msg .who{font-size:11px;color:var(--muted)}
.msg .txt{background:var(--room-2);border:1px solid var(--line);padding:6px 10px;border-radius:4px 12px 12px 12px;word-break:break-word}
.msg.mine{align-self:flex-end;align-items:flex-end}
.msg.mine .txt{background:var(--brass-soft);border-color:rgba(217,168,73,.35);border-radius:12px 4px 12px 12px}
.msg.sys{align-self:center;max-width:100%;font-size:11.5px;color:var(--muted);text-align:center}
.chat form{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
.chat form .input{padding:9px 11px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:29}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ivory);color:var(--card-ink);padding:8px 14px;border-radius:10px;font-size:13px;font-weight:500;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
@media (max-width:420px){
  .seat{width:80px}.plate{min-width:72px;padding:3px 6px}.plate .nm{max-width:70px;font-size:11px}.plate .stk{font-size:14px}
  .minis{height:30px}.card.sm{--w:22px}
  .brand{font-size:17px}.tablewrap{padding:30px 22px 36px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
*,*::before,*::after{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">우리끼리 <b>홀덤</b></div>
    <span id="codeChip" class="chip-code" hidden role="button" tabindex="0" title="초대 링크 복사"><span class="dot" id="connDot"></span><span id="codeTxt"></span></span>
    <div class="spacer"></div>
    <button class="btn sm" id="chatBtn" hidden>채팅<span id="unread" class="badge" hidden></span></button>
    <button class="btn sm ghost" id="leaveBtn" hidden>나가기</button>
  </header>

  <main id="home">
    <div class="home-inner">
      <div class="hero">
        <div class="fan" id="fan"></div>
        <h1>우리끼리 홀덤</h1>
        <p>방을 만들고 링크나 코드를 보내면 친구들이 바로 들어와요. 노리밋 텍사스 홀덤, 최대 8명.</p>
      </div>
      <div id="resumeBox" hidden></div>
      <form class="form" id="homeForm" autocomplete="off">
        <div class="field">
          <label for="nameIn">닉네임</label>
          <input class="input" id="nameIn" maxlength="10" placeholder="예: 민수">
        </div>
        <button class="btn brass" type="button" id="createBtn" style="padding:12px">방 만들기</button>
        <div class="or">또는 코드로 입장</div>
        <div class="row">
          <input class="input code" id="codeIn" maxlength="5" placeholder="ABCDE" autocapitalize="characters">
          <button class="btn ivory" type="submit" id="joinBtn">입장</button>
        </div>
        <div class="note"><b>친구 부르는 법</b> · 방을 만든 뒤 위쪽 코드를 누르면 초대 링크가 복사돼요. 카톡으로 보내면 친구는 링크를 열고 닉네임만 적으면 바로 같은 방에 들어와요.</div>
      </form>
    </div>
  </main>

  <main id="room" hidden>
    <section class="stage">
      <div class="tablewrap">
        <div class="table" id="table">
          <div class="felt"></div>
          <div class="stamp">NO LIMIT HOLD'EM</div>
          <div id="layer"></div>
        </div>
      </div>
      <div class="dock" id="dock"></div>
    </section>
    <aside class="chat" id="chat" aria-label="채팅">
      <div class="chat-head">채팅 <button class="btn sm ghost close" id="chatClose" type="button">닫기</button></div>
      <ol id="chatList"></ol>
      <form id="chatForm" autocomplete="off">
        <input class="input" id="chatIn" maxlength="140" placeholder="메시지 입력">
        <button class="btn brass" type="submit">보내기</button>
      </form>
    </aside>
  </main>
  <div id="scrim" class="scrim" hidden></div>
  <div id="toast"></div>
</div>

<script>
'use strict';
const $=(s)=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('ko-KR');
const store={
  get(k,ss){try{const v=(ss?sessionStorage:localStorage).getItem(k);return v?JSON.parse(v):null}catch(e){return null}},
  set(k,v,ss){try{(ss?sessionStorage:localStorage).setItem(k,JSON.stringify(v))}catch(e){}},
  del(k,ss){try{(ss?sessionStorage:localStorage).removeItem(k)}catch(e){}}
};
const rid=(n)=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,x=>'abcdefghijkmnpqrstuvwxyz23456789'[x%32]).join('')};
let toastT=0;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2200)}

/* ---------- 카드 & 족보 (내 패 표시용) ---------- */
const RANKS='23456789TJQKA';
const SUIT_CH={s:'♠︎',h:'♥︎',d:'♦︎',c:'♣︎'};
const RNAME=r=>r===8?'10':RANKS[r];
function eval5(cs){
  const rs=cs.map(c=>RANKS.indexOf(c[0])).sort((a,b)=>b-a);
  const flush=cs.every(c=>c[1]===cs[0][1]);const uniq=[...new Set(rs)];let sh=-1;
  if(uniq.length===5){if(uniq[0]-uniq[4]===4)sh=uniq[0];else if(uniq[0]===12&&uniq[1]===3)sh=3}
  const cnt={};rs.forEach(r=>cnt[r]=(cnt[r]||0)+1);
  const g=Object.entries(cnt).map(([r,c])=>[+r,c]).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);const gr=g.map(x=>x[0]);
  if(sh>=0&&flush)return[8,sh];if(g[0][1]===4)return[7,...gr];if(g[0][1]===3&&g[1][1]===2)return[6,...gr];
  if(flush)return[5,...rs];if(sh>=0)return[4,sh];if(g[0][1]===3)return[3,...gr];
  if(g[0][1]===2&&g[1][1]===2)return[2,...gr];if(g[0][1]===2)return[1,...gr];return[0,...rs];
}
function cmpScore(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]??-1)-(b[i]??-1);if(d)return d}return 0}

/* 서버 연결: 서버 → 화면은 EventSource, 화면 → 서버는 POST */
const net={es:null,handlers:{},
  on(ev,fn){this.handlers[ev]=fn},
  connect(){
    if(this.es)this.es.close();
    const es=this.es=new EventSource('/events?pid='+encodeURIComponent(PID));
    es.onopen=()=>{S.conn=true;renderTop();renderTable();if(S.code)net.send('join',{code:S.code,name:S.name})};
    es.onerror=()=>{S.conn=false;renderTop()};
    for(const ev of ['state','chat','chatlog','nojoin','err'])es.addEventListener(ev,e=>{let d;try{d=JSON.parse(e.data)}catch(_){return}const fn=net.handlers[ev];if(fn)fn(d)});
  },
  get connected(){return !!this.es&&this.es.readyState===1},
  send(type,data){
    fetch('/api',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pid:PID,type,...(data||{})}),keepalive:true})
      .catch(()=>toast('서버에 보내지 못했어요. 연결 상태를 확인해 주세요'));
  }
};

function tick(){
  const v=S.view;if(!v)return;const now=Date.now(),h=v.h;
  if(S.pendSq===h.sq&&now-S.actAt>4000){S.pendSq=-1;renderDock(true)}
  if(v.status==='playing'&&h.tu>=0&&BETTING.has(h.st)){
    const lim=(v.set.timer||0)*1000,el=now-S.turnT0;
    const plate=document.querySelector(`.seat[data-i="${h.tu}"] .plate`);
    if(plate&&lim)plate.style.setProperty('--p',Math.min(1,el/lim).toFixed(3));
    const tt=$('#timerTxt');if(tt)tt.textContent=lim?`${Math.max(0,Math.ceil((lim-el)/1000))}초`:'';
  }
}

/* ---------- 초대 링크 ---------- */
function inviteLink(){return location.origin+location.pathname+'#'+S.code}
function copyLink(){
  const link=inviteLink();
  const fallback=()=>{const el=$('#bigCode')||$('#codeTxt');try{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}catch(e){}toast('복사가 안 되면 코드 '+S.code+'를 직접 알려 주세요')};
  try{navigator.clipboard.writeText(link).then(()=>toast('초대 링크를 복사했어요. 카톡에 붙여 넣어 보내 주세요'),fallback)}catch(e){fallback()}
}

/* ---------- 홈 ---------- */
function renderHome(){
  $('#nameIn').value=S.name;
  const fan=$('#fan');
  if(!fan.childElementCount)fan.innerHTML=['As','Kh','Qd'].map(c=>cardHTML(c,'lg')).join('');
  [...fan.children].forEach((el,k)=>{el.style.transform=`translateX(-50%) rotate(${(k-1)*12}deg)`});
  const hc=(location.hash||'').replace('#','').toUpperCase();
  if(/^[A-Z0-9]{5}$/.test(hc)&&!$('#codeIn').value)$('#codeIn').value=hc;
  const rb=$('#resumeBox');rb.hidden=true;rb.innerHTML='';
  const last=store.get('hd-last');
  if(last&&last.code&&Date.now()-last.at<12*3600e3){
    rb.hidden=false;
    rb.innerHTML=`<div class="resume"><span>방 <b class="num" style="color:var(--brass);letter-spacing:.12em">${esc(last.code)}</b>에 다시 들어가기</span><span class="row"><button class="btn sm brass" id="resumeBtn" type="button">입장</button><button class="btn sm ghost" id="dropBtn" type="button">지우기</button></span></div>`;
    $('#resumeBtn').onclick=()=>{if(!takeName())return;if(last.pid&&last.pid!==PID){PID=last.pid;store.set('hd-pid',PID,true);S.code=last.code;resetRoomUI();showScreen('room');render();net.connect();return}joinRoom(last.code)};
    $('#dropBtn').onclick=()=>{store.del('hd-last');renderHome()};
  }
}
function takeName(){
  const n=$('#nameIn').value.trim().slice(0,10);
  if(!n){$('#nameIn').focus();toast('닉네임을 먼저 적어 주세요');return false}
  S.name=n;store.set('hd-name',n);return true;
}
function resetRoomUI(){S.view=null;S.unread=0;S.sqSeen=-1;S.pendSq=-1;S.dockSig='';S.bubbles={};$('#chatList').innerHTML=''}
function joinRoom(code){
  resetRoomUI();S.code=code;showScreen('room');render();
  if(socket.connected)socket.emit('join',{code,name:S.name});
}
function leaveRoom(){
  socket.emit('leave');store.del('hd-room',true);store.del('hd-last');
  S.code='';resetRoomUI();history.replaceState(null,'',location.pathname);
  showScreen('home');renderHome();
}

/* ---------- 이벤트 ---------- */
$('#createBtn').onclick=()=>{
  if(!takeName())return;
  if(!socket.connected){toast('서버에 연결하는 중이에요. 잠시 후 다시 눌러 주세요');return}
  resetRoomUI();S.code='';showScreen('room');render();
  socket.emit('create',{name:S.name});
};
$('#homeForm').onsubmit=e=>{e.preventDefault();const c=$('#codeIn').value.trim().toUpperCase();if(!/^[A-Z0-9]{5}$/.test(c)){toast('5자리 방 코드를 입력해 주세요');return}if(!takeName())return;joinRoom(c)};
$('#codeIn').oninput=e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'')};
$('#codeChip').onclick=copyLink;
$('#codeChip').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();copyLink()}};
$('#leaveBtn').onclick=()=>{if(S.leaveArm>Date.now()){S.leaveArm=0;leaveRoom()}else{S.leaveArm=Date.now()+3000;renderTop();setTimeout(renderTop,3100)}};
function syncChatSheet(){$('#chat').classList.toggle('open',S.chatOpen);$('#scrim').hidden=!S.chatOpen}
$('#chatBtn').onclick=()=>{S.chatOpen=true;S.unread=0;syncChatSheet();renderTop();const ol=$('#chatList');ol.scrollTop=ol.scrollHeight};
$('#chatClose').onclick=$('#scrim').onclick=()=>{S.chatOpen=false;syncChatSheet()};
$('#chatForm').onsubmit=e=>{e.preventDefault();const inp=$('#chatIn');const t=inp.value.trim();if(!t)return;socket.emit('chat',{t});inp.value=''};
setInterval(tick,250);

if(S.code){showScreen('room');render()}else{showScreen('home');renderHome()}
const hc0=(location.hash||'').replace('#','').toUpperCase();
if(!S.code&&/^[A-Z0-9]{5}$/.test(hc0)){toast('닉네임을 적고 입장을 눌러 주세요');setTimeout(()=>$('#nameIn').focus(),300)}
</script>
</body>
